# Logto (self-hosted identity provider) on Fly.io — public app.
#
# Image is pulled directly (no Dockerfile needed — Logto is stateless, all
# persistence lives in Postgres, which is a separate Fly app: see
# logto-db/fly.toml). Core listens on 3001, the Admin Console on 3002.
# Only 3001 is exposed publicly here — see "Admin console access" in the
# README for why 3002 is deliberately not.
#
# See https://fly.io/docs/reference/configuration/

app = 'logto-af'
primary_region = 'lax'

[build]
  image = 'svhd/logto:latest'

[env]
  # Must match the public URL exactly — Logto derives the OIDC issuer and
  # every redirect URL from this. Cut over to the custom domain now that
  # `fly certs show auth.yusufaf.dev --app logto-af` reports Issued.
  ENDPOINT = 'https://auth.yusufaf.dev'

  # Admin Console stays off the public listener (port 3002 is never in
  # [http_service] / [[services]] below) — reach it with
  # `fly proxy 3002:3002 -a logto-af` (see "Admin console access" in the
  # README, including an optional stable-tailnet-URL upgrade via Tailscale).
  #
  # ADMIN_ENDPOINT is set via `fly secrets set`, NOT here (see README "App
  # secrets") — this repo is public, and even the default localhost value is
  # kept out of git so the pattern matches DB_URL / SECRET_VAULT_KEK below;
  # if you take the Tailscale upgrade its value becomes a private tailnet
  # hostname instead, which really would need to stay uncommitted. Must be
  # exactly the origin the console is actually browsed from — Logto only
  # allows CORS from ADMIN_ENDPOINT's origin, and the Admin Console's Web
  # Crypto usage refuses to run over plain HTTP on anything but localhost.

  # Always set behind Fly's proxy — without it the OIDC hosted sign-in
  # pages see requests as http:// and the "secure cookie over insecure
  # connection" failure mode kicks in.
  TRUST_PROXY_HEADER = '1'

  # DB_URL and SECRET_VAULT_KEK are secrets (`fly secrets set`), never here —
  # see README "Deploy" step 4.

[http_service]
  internal_port = 3001
  force_https = true

  # Always-on: a cold start on the JWKS endpoint can make a Lambda API
  # authorizer time out rather than just feel slow (Phase 2/3 of the auth
  # migration plan). Revisit once JWKS caching is confirmed working there.
  auto_stop_machines = 'off'
  min_machines_running = 1
  auto_start_machines = true

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.http_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '60s'
    method = 'GET'
    path = '/oidc/.well-known/openid-configuration'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
